name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/github-pages-temp-9058
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static web
        run: pnpm --filter @gal-yiba/web... build
        env:
          VITE_BASE: /gal-yiba/
          VITE_STATIC_PLAY: "true"
      - name: Disable Jekyll
        run: touch apps/web/dist/.nojekyll
      - name: Enable GitHub Pages if needed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages" -f build_type=workflow
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
